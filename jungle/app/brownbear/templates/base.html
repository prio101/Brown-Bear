<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Brown Bear{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // ?theme=dark|light wins over the stored choice, which makes a given
      // appearance linkable and screenshottable.
      (function () {
        var forced = new URLSearchParams(location.search).get("theme");
        var saved = forced || localStorage.getItem("bb-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><span class="mark"></span> Brown Bear</span>
      <nav>
        <a href="/" {% if page == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        <a href="/tokens" {% if page == 'tokens' %}aria-current="page"{% endif %}>Tokens</a>
        <a href="/cache" {% if page == 'cache' %}aria-current="page"{% endif %}>Cache</a>
        <a href="/collections" {% if page == 'collections' %}aria-current="page"{% endif %}>Collections</a>
        <a href="/settings" {% if page == 'settings' %}aria-current="page"{% endif %}>Settings</a>
      </nav>
      <span class="spacer"></span>
      <button class="ghost-button" id="theme-toggle" type="button">Theme</button>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <script src="/static/charts.js"></script>
    <script>
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var root = document.documentElement;
        var current =
          root.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("bb-theme", next);
        window.dispatchEvent(new Event("resize")); // charts re-read colour tokens
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
