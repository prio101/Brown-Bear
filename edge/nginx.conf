# Edge allowlist for anything reachable from the internet.
#
# The app has no authentication yet (spec 002 §2.3). Until it does, the only
# thing standing between the internet and PUT /api/settings is *what this file
# chooses to forward*. So it default-denies and names the exceptions.
#
# This is NOT authentication. Everything allowed below is reachable by anyone
# who learns the tunnel hostname. It limits blast radius; it does not identify
# callers. Nothing that mutates state or reveals usage data is listed.
#
# The tunnel points at this origin, never at app:8080 directly — so the
# allowlist holds even for a quick tunnel, which cannot filter paths itself.

server {
    listen 8081;
    server_name _;

    # Keep the origin quiet about what it is running.
    server_tokens off;

    # A body large enough for document ingestion, small enough that an
    # unauthenticated endpoint cannot be used to fill the disk.
    client_max_body_size 32m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ---- default: deny ----------------------------------------------------
    # Everything not named below lands here, including /api/settings,
    # /api/tokens/*, /api/export, /metrics and the whole /ollama/* proxy.
    location / {
        default_type application/json;
        return 403 '{"error":"not exposed","detail":"This path is not published through the tunnel."}';
    }

    # ---- allowed: liveness ------------------------------------------------
    # Reveals nothing but whether the app is up.
    location = /api/health/live {
        limit_except GET { deny all; }
        proxy_pass http://app:8080/api/health/live;
        include /etc/nginx/proxy_common.conf;
    }

    # ---- allowed: the external gateway surface ----------------------------
    # Spec 005's context and exchange endpoints live here. They do not exist
    # yet, so this currently proxies to a 404 — listed now so the allowlist
    # does not have to be edited under time pressure when they land.
    #
    # These endpoints take prompts and return retrieved context, so they must
    # gain API-key auth (spec 002 §2.3) before they carry anything real.
    location /ext/ {
        proxy_pass http://app:8080/ext/;
        include /etc/nginx/proxy_common.conf;
    }
}
