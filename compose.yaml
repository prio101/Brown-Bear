services:
  # ==================== BROWN BEAR APP ====================
  # Single FastAPI app (roadmap decision D4): dashboard, tracker, maintenance
  # and gateway are mounted routers, not separate services.
  app:
    build:
      context: ./jungle/app
      # Explicit: without it Compose builds the Dockerfile's last stage, which
      # is `dev` — the app would come up running pytest instead of uvicorn.
      target: runtime
    container_name: brownbear-app
    ports:
      - "8080:8080"
    environment:
      - BB_DATABASE_URL=postgresql+psycopg://vectoradmin:vectoradmin123@postgres:5432/brownbear
      - BB_OLLAMA_URL=http://ollama:11434
      - BB_CHROMA_URL=http://chromadb:8000
      - BB_REDIS_URL=redis://:your_strong_password@redis:6379/0
    volumes:
      # BB-109: the public design book. Mounted read-only rather than baked into
      # the image so editing a document publishes it without a rebuild — a stale
      # published book is worse than none. Read-only: the app never writes here.
      - ./jungle/dev/design:/app/brownbear/design:ro
    depends_on:
      - postgres
      - ollama
      - chromadb
      - redis
    restart: unless-stopped

  # ==================== FRONTEND (BB-101) ====================
  # Next.js dashboard. Bound to loopback: public access is the edge's job, and
  # the edge proxies the page routes here (BB-104). Data fetching happens
  # server-side against app:8080, so no API credential reaches the browser.
  web:
    build:
      context: ./jungle/web
      # Explicit, for the same reason the app service says it: the Dockerfile has
      # more than one stage and the last one is not the one to ship.
      target: runtime
    container_name: brownbear-web
    ports:
      # Host 3001, not 3000: on this host 3000 sits in a Windows/Hyper-V
      # excluded port range and Docker cannot bind it ("access permissions"),
      # even though nothing is listening. 3001 also groups the UIs — 3001 web,
      # 3002 vectoradmin. The container port stays 3000, so the edge still
      # proxies to web:3000 and nothing inside the network changes.
      - "127.0.0.1:3001:3000"
    environment:
      - BB_API_URL=http://app:8080
    depends_on:
      - app
    restart: unless-stopped

  # ==================== EDGE (the tunnel's origin) ====================
  # Authentication plus a default-deny allowlist in front of the app. The tunnel
  # points here, never at app:8080, so both hold even for a quick tunnel — which
  # can filter neither paths nor headers. See edge/nginx.conf.template.
  # Bound to loopback so it is testable locally without joining the LAN.
  edge:
    image: nginx:1.27-alpine
    container_name: brownbear-edge
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # A template, not a conf: the nginx entrypoint runs envsubst over
      # /etc/nginx/templates so the shared secret stays in .env.
      - ./edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./edge/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      # Timeouts are separate includes because nginx rejects a duplicate
      # directive in one context: each location picks default or long, never both.
      - ./edge/proxy_timeouts.conf:/etc/nginx/proxy_timeouts.conf:ro
      - ./edge/proxy_timeouts_long.conf:/etc/nginx/proxy_timeouts_long.conf:ro
    environment:
      # Defaulted, not required: compose interpolates the whole file on every
      # command, so a `:?` guard here would break `docker compose up` even when
      # the tunnel profiles are not selected. An unset secret renders a config
      # whose only valid credential is the literal empty string, and every
      # authenticated route then answers 401 — closed, not open.
      - BB_EDGE_TOKEN=${BB_EDGE_TOKEN:-}
      - BB_EDGE_BASIC=${BB_EDGE_BASIC:-}
    depends_on:
      - app
    restart: unless-stopped

  # ==================== CLOUDFLARE TUNNEL ====================
  # THE ACTIVE TUNNEL IS NOT IN THIS FILE.
  #
  # The public URL is fixed at  https://brownbear.frostmangobox.com  and is
  # served by the host's own cloudflared (systemd unit `cloudflared.service`,
  # a named tunnel run from /etc/cloudflared/token). Its public hostname routes
  # to http://localhost:8081 — this file's `edge`, reached through the
  # 127.0.0.1:8081 binding, since that cloudflared runs outside the compose
  # network. Ingress is managed remotely in the Zero Trust dashboard, so there
  # is nothing here to change when a route changes:
  #     systemctl status cloudflared
  #     journalctl -u cloudflared -f
  #
  # Both services below sit behind compose profiles, so neither starts with a
  # plain `docker compose up` — nothing gets published by accident, and in the
  # normal case neither should ever be started at all.
  #
  # Alternative, currently unused: run the named tunnel inside compose instead
  # of on the host. Only if you deliberately want the tunnel to live and die
  # with the stack. Set CLOUDFLARE_TUNNEL_TOKEN in .env, point that tunnel's
  # public hostname at http://edge:8081 (not localhost:8081 — this one *is* on
  # the compose network), then:  docker compose --profile tunnel up -d
  # Do not run this at the same time as the host service for the same tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Defaulted rather than required: compose interpolates the whole file on
      # every command, so a `:?` guard here would break `docker compose up`
      # even when this profile is not selected. cloudflared reports a missing
      # token clearly enough on its own.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - edge
    restart: unless-stopped

  # Throwaway tunnel, for local testing ONLY: no account, random
  # *.trycloudflare.com URL, gone when the container stops. The URL is printed
  # in its logs.
  #   docker compose --profile quicktunnel up -d && docker compose logs -f cloudflared-quick
  #
  # Never hand this URL to another machine. It changes on every restart, and the
  # client hooks fail open — so when it dies, every remote node silently stops
  # contributing to the memory graph instead of reporting an error. That is
  # precisely what the fixed hostname above exists to prevent.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-quick
    profiles: ["quicktunnel"]
    command: tunnel --no-autoupdate --url http://edge:8081
    depends_on:
      - edge
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Optional: Enable GPU (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  # ==================== CHROMA ADMIN UI ====================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vectoradmin
      POSTGRES_PASSWORD: vectoradmin123      # Change this to something strong
      POSTGRES_DB: vdbms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the dedicated `brownbear` database on a fresh volume only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  # ==================== VECTORADMIN ====================
  vectoradmin:
    image: mintplexlabs/vectoradmin:latest
    container_name: vectoradmin
    ports:
      - "3002:3000"                     # Access UI at http://localhost:3002
    environment:
      - DATABASE_CONNECTION_STRING=postgresql://vectoradmin:vectoradmin123@postgres:5432/vdbms
      - JWT_SECRET=your-super-secret-jwt-key-change-this-2026
      - INNGEST_SIGNING_KEY=your-inngest-signing-key-change-this
      - INNGEST_EVENT_KEY=background_workers
      # Optional: Login protection
      # - SYS_EMAIL=admin@local.com
      # - SYS_PASSWORD=admin123
    restart: unless-stopped
    depends_on:
      - postgres
      - chromadb
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass your_strong_password
    restart: unless-stopped

  # Optional but Highly Recommended: RedisInsight (GUI for Redis)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"               # Access at http://localhost:5540
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  ollama_data:
  chroma_data:
  redis_data:
  redisinsight_data:
  postgres_data:
