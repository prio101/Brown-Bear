[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brownbear"
version = "0.1.0"
description = "Monitoring, metering and maintenance layer for the Brown Bear AI stack"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "httpx>=0.28",
    "jinja2>=3.1",
    "apscheduler>=3.11",
    "psutil>=6.1",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["brownbear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The runtime image runs as a non-root user with a read-only working tree.
cache_dir = "/tmp/pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "/tmp/ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
