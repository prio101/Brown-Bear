# Shared proxy settings for allowed locations.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Cloudflare passes the true client IP here; keep it for the audit log that
# spec 002 §2.3 will add.
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_connect_timeout 10s;
proxy_buffering off;
# Send/read timeouts are NOT set here: nginx rejects a duplicate directive in
# the same context, so a location that needs longer than the default cannot
# override them after this include. Each location includes exactly one of
# proxy_timeouts.conf or proxy_timeouts_long.conf instead.
